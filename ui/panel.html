<style>
#fourthwall-chat-root{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;font-size:14px;color:#f0ebfa}
#fw-launch{position:fixed;right:15px;bottom:94px;z-index:960;width:48px;height:48px;border:1px solid #9987b7;border-radius:50%;background:#292335;color:#f2d7ff;box-shadow:0 5px 20px #0008;font-size:21px;cursor:pointer}
#fw-panel{position:fixed;right:8px;bottom:76px;z-index:961;width:min(470px,calc(100vw - 16px));height:min(730px,calc(100dvh - 95px));border-radius:16px;background:#1b1726;border:1px solid #67587f;box-shadow:0 20px 45px #000a;display:flex;flex-direction:column;overflow:hidden}
#fw-panel[hidden]{display:none}#fw-panel *{box-sizing:border-box}#fw-panel button,#fw-panel textarea,#fw-panel input,#fw-panel select{font:inherit}#fw-panel button{cursor:pointer;color:inherit}#fw-panel button:disabled{opacity:.42;cursor:default}
.fw-header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#242034;border-bottom:1px solid #40364d}.fw-title{flex:1;min-width:0}.fw-title b{font-family:Georgia,serif;font-size:17px;letter-spacing:.08em}.fw-title small{display:block;font-size:10px;color:#bcb1d3}.fw-close{background:none;border:0;font-size:22px}
.fw-topline{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:6px;padding:9px 10px;align-items:center;border-bottom:1px solid #40364d}
.fw-field{display:flex;min-width:0;flex-direction:column;gap:3px;font-size:11px;color:#c3b5d6}.fw-field select{width:100%;padding:7px 6px;border-radius:7px;background:#322a40;border:1px solid #61516f;color:#fff}
.fw-small{padding:7px;border-radius:7px;border:1px solid #625477;background:#373047;font-size:12px}
.fw-nav{display:flex;gap:4px;padding:7px 10px;border-bottom:1px solid #40364d}.fw-nav button{flex:1;border:0;border-radius:7px;padding:6px 2px;background:transparent;color:#bfb2d6!important;font-size:12px!important}.fw-nav button[aria-selected=true]{background:#46375c;color:white!important}
#fw-info{min-height:24px;color:#b9aacd;font-size:11px;padding:6px 12px 3px;white-space:normal}
.fw-view{flex:1;min-height:0;display:flex;flex-direction:column}.fw-view[hidden]{display:none!important}
#fw-log{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:9px}
.fw-bubble{position:relative;max-width:88%;padding:10px 11px 8px;border-radius:13px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}
.fw-bubble.user{align-self:flex-end;background:#554273}.fw-bubble.ai{align-self:flex-start;background:#302a40}.fw-bubble.notice{align-self:center;background:#292536;color:#c4bbd4;font-size:12px}
.fw-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:10px;opacity:.7;margin-bottom:5px}.fw-meta-buttons{display:flex;gap:7px}.fw-meta-buttons button{padding:0 2px;border:0;background:transparent;font-size:13px}
.fw-chat-tools{display:flex;gap:6px;padding:0 10px 7px;flex-wrap:wrap}.fw-chat-tools button{background:#2c263a;border:1px solid #51435e;border-radius:7px;padding:5px 8px;font-size:12px}
#fw-compose{display:flex;gap:7px;padding:9px 10px;border-top:1px solid #40364d}#fw-input{flex:1;min-width:0;resize:none;max-height:130px;min-height:45px;border-radius:9px;background:#282237;border:1px solid #655276;padding:9px;color:white}
#fw-send,.fw-primary{background:#7255a2!important;color:white!important;border:0!important;border-radius:8px;padding:8px 13px!important}
.fw-inner{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:9px}.fw-help{font-size:12px;color:#bcb0cb;line-height:1.6;margin:0}.fw-label{font-size:12px;color:#d9c9ec}
.fw-inner textarea{width:100%;min-height:90px;resize:vertical;border-radius:8px;border:1px solid #675776;padding:9px;background:#282237;color:#fff;line-height:1.5}
.fw-inner input[type=number],.fw-inner input[type=text]{background:#282237;color:white;border:1px solid #675776;border-radius:7px;padding:7px;width:100%}
.fw-actions{display:flex;gap:7px;flex-wrap:wrap}.fw-actions button{padding:7px 9px;background:#352b45;border:1px solid #675776;border-radius:7px;font-size:12px}
.fw-setting{display:flex;align-items:center;justify-content:space-between;gap:12px}.fw-setting label{flex:1}.fw-setting input[type=number]{width:82px}.fw-setting input[type=checkbox]{width:18px;height:18px}
.fw-divider{height:1px;background:#41364e;margin:5px 0}.fw-danger{border-color:#834856!important;color:#ffbec5!important}
.fw-foot{padding:6px 10px;background:#211c2f;border-top:1px solid #40364d;font-size:10px;color:#9b8eaf}
</style>
<div id="fourthwall-chat-root">
<button id="fw-launch" type="button" aria-label="打开第四面墙">Ⅳ</button>
<section id="fw-panel" aria-label="第四面墙会客厅" hidden>
<header class="fw-header"><div class="fw-title"><b>Ⅳ 第四面墙 · 角色直聊</b><small>皮下语 C · 独立会客厅</small></div><button id="fw-close" class="fw-close" type="button" aria-label="关闭">×</button></header>
<div class="fw-topline">
<label class="fw-field">扮演人物<select id="fw-actor"></select></label>
<label class="fw-field">聊天记录<select id="fw-session"></select></label>
<button class="fw-small" id="fw-sync" type="button">同步</button>
</div>
<nav class="fw-nav" aria-label="会客厅功能">
<button data-view="chat" aria-selected="true">私聊</button>
<button data-view="memory" aria-selected="false">皮下记忆</button>
<button data-view="prompt" aria-selected="false">提示词</button>
<button data-view="settings" aria-selected="false">设置</button>
</nav>
<div id="fw-info" role="status" aria-live="polite"></div>
<div class="fw-view" data-page="chat">
<div id="fw-log"></div>
<div class="fw-chat-tools">
<button id="fw-new" type="button">＋新记录</button>
<button id="fw-rename" type="button">重命名</button>
<button id="fw-remove-session" type="button">删除记录</button>
<button id="fw-regenerate" type="button">重新回答</button>
<button id="fw-comment" type="button">吐槽主线</button>
<button id="fw-clear" class="fw-danger" type="button">清空聊天</button>
</div>
<form id="fw-compose"><textarea id="fw-input" rows="2" maxlength="6000" placeholder="对扮演这位人物的语 C 搭档说话……"></textarea><button id="fw-send" type="submit">发送</button></form>
</div>
<div class="fw-view" data-page="memory" hidden>
<div class="fw-inner">
<p class="fw-help">这里只记录皮下私聊的总结，不修改 Tavo 原本的长期记忆。独立的“皮下记忆”可以手动编辑，也可以让当前模型总结旧私聊。</p>
<label class="fw-label" for="fw-memory">当前人物 · 当前记录的皮下记忆</label>
<textarea id="fw-memory" style="flex:1;min-height:220px" placeholder="这里可以保存你与语 C 搭档的共同记忆、语气习惯与长期约定……"></textarea>
<div class="fw-actions"><button id="fw-memory-save" class="fw-primary" type="button">保存记忆</button><button id="fw-memory-summary" type="button">总结旧私聊</button><button id="fw-memory-clear" class="fw-danger" type="button">清空记忆</button></div>
<p id="fw-memory-stats" class="fw-help"></p></div>
</div>
<div class="fw-view" data-page="prompt" hidden>
<div class="fw-inner">
<p class="fw-help">使用皮下提示词分层：开场、身份协议、收尾。可自由修改，修改只作用于会客厅，不影响 GodOfNovel 和其他预设。</p>
<label class="fw-label">开场提示词</label><textarea id="fw-prompt-top"></textarea>
<label class="fw-label">皮下身份协议</label><textarea id="fw-prompt-protocol" style="min-height:185px"></textarea>
<label class="fw-label">收尾提示词</label><textarea id="fw-prompt-bottom"></textarea>
<div class="fw-actions"><button id="fw-prompt-save" class="fw-primary" type="button">保存提示词</button><button id="fw-prompt-reset" class="fw-danger" type="button">恢复默认</button></div>
<p class="fw-help">可用占位符：{{CHAR_NAME}}、{{USER_NAME}}、{{USER_INPUT}}。</p></div>
</div>
<div class="fw-view" data-page="settings" hidden>
<div class="fw-inner">
<label class="fw-setting"><span>附带主线聊天层数</span><input id="fw-layers" type="number" min="1" max="200" value="20"></label>
<label class="fw-setting"><span>皮下历史保留条数</span><input id="fw-direct-layers" type="number" min="4" max="100" value="24"></label>
<div class="fw-divider"></div>
<label class="fw-setting"><span>自动皮下记忆（较长对话自动总结，会调用模型）</span><input id="fw-auto-summary" type="checkbox"></label>
<label class="fw-setting"><span>实时吐槽主线（自动调用模型）</span><input id="fw-live" type="checkbox"></label>
<label class="fw-setting"><span>吐槽触发概率 %</span><input id="fw-live-prob" type="number" min="1" max="100" value="30"></label>
<div class="fw-divider"></div>
<label class="fw-setting"><span>允许生成模拟图片 [img:]（使用当前生图 API）</span><input id="fw-images" type="checkbox"></label>
<label class="fw-setting"><span>允许语音 [voice:]（使用当前 TTS 绑定）</span><input id="fw-voice" type="checkbox"></label>
<div class="fw-actions"><button id="fw-settings-save" class="fw-primary" type="button">保存设置</button><button id="fw-export" type="button">导出当前记录</button></div>
<p class="fw-help">TavoJS 目前不提供真正的流式 token 回调，回复会在请求完成后整体显示。自动吐槽和自动总结默认关闭，以避免产生额外 API 费用。</p>
</div></div>
<footer class="fw-foot">读主线、不改主线 · 角色分开 · 皮下记忆独立保存</footer>
</section></div>
<script src="/plugins/dev.yxu9949-design.fourthwall-room/ui/panel.js"></script>
